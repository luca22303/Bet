[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bet"
version = "0.1.0"
description = "Bundesliga analytics: point-in-time data spine and forecast backtesting harness"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.31",
    "pydantic>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
bet = "bet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
